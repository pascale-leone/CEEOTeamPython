<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EasyLego Python Tutor</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f0f4f8;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      width: 100%;
      background: #1a73e8;
      color: white;
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    }

    header h1 {
      font-size: 1.2rem;
      font-weight: 600;
      letter-spacing: 0.3px;
    }

    header span {
      font-size: 0.85rem;
      opacity: 0.85;
    }

    #clear-btn {
      background: rgba(255,255,255,0.2);
      border: 1px solid rgba(255,255,255,0.5);
      color: white;
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      transition: background 0.15s;
    }

    #clear-btn:hover { background: rgba(255,255,255,0.35); }

    #chat-container {
      width: 100%;
      max-width: 800px;
      flex: 1;
      overflow-y: auto;
      padding: 24px 16px 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .message {
      display: flex;
      flex-direction: column;
      max-width: 80%;
    }

    .message.user { align-self: flex-end; align-items: flex-end; }
    .message.assistant { align-self: flex-start; align-items: flex-start; }

    .bubble {
      padding: 10px 14px;
      border-radius: 16px;
      line-height: 1.55;
      font-size: 0.95rem;
      word-break: break-word;
    }

    .message.user .bubble {
      background: #1a73e8;
      color: white;
      border-bottom-right-radius: 4px;
    }

    .message.assistant .bubble {
      background: white;
      color: #1a1a1a;
      border-bottom-left-radius: 4px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.1);
    }

    /* Markdown inside assistant bubbles */
    .message.assistant .bubble p { margin-bottom: 0.5em; }
    .message.assistant .bubble p:last-child { margin-bottom: 0; }
    .message.assistant .bubble pre {
      background: #f5f5f5;
      border: 1px solid #ddd;
      border-radius: 6px;
      padding: 10px 12px;
      overflow-x: auto;
      margin: 8px 0;
    }
    .message.assistant .bubble code {
      font-family: "SF Mono", "Fira Code", monospace;
      font-size: 0.88em;
      background: #f0f0f0;
      padding: 1px 4px;
      border-radius: 3px;
    }
    .message.assistant .bubble pre code {
      background: none;
      padding: 0;
    }
    .message.assistant .bubble ul,
    .message.assistant .bubble ol {
      padding-left: 1.3em;
      margin: 6px 0;
    }
    .message.assistant .bubble li { margin-bottom: 2px; }

    .label {
      font-size: 0.72rem;
      color: #888;
      margin-bottom: 3px;
      padding: 0 4px;
    }

    /* Typing indicator */
    .typing .bubble {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 12px 16px;
    }
    .dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: #aaa;
      animation: bounce 1.1s infinite;
    }
    .dot:nth-child(2) { animation-delay: 0.18s; }
    .dot:nth-child(3) { animation-delay: 0.36s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); }
      40% { transform: translateY(-5px); }
    }

    /* Welcome message */
    #welcome {
      align-self: center;
      text-align: center;
      color: #555;
      margin-top: 40px;
    }
    #welcome h2 { font-size: 1.1rem; margin-bottom: 8px; color: #333; }
    #welcome p { font-size: 0.9rem; line-height: 1.5; }
    #welcome .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-top: 16px;
    }
    .chip {
      background: white;
      border: 1px solid #d0d7de;
      border-radius: 20px;
      padding: 6px 14px;
      font-size: 0.83rem;
      color: #1a73e8;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }
    .chip:hover { background: #e8f0fe; border-color: #1a73e8; }

    /* Input bar */
    #input-bar {
      width: 100%;
      max-width: 800px;
      padding: 12px 16px 20px;
      display: flex;
      gap: 10px;
      background: #f0f4f8;
    }

    #user-input {
      flex: 1;
      padding: 10px 14px;
      border: 1px solid #ccc;
      border-radius: 24px;
      font-size: 0.95rem;
      outline: none;
      resize: none;
      background: white;
      line-height: 1.4;
      max-height: 120px;
      overflow-y: auto;
      transition: border-color 0.15s;
    }
    #user-input:focus { border-color: #1a73e8; }

    #send-btn {
      background: #1a73e8;
      color: white;
      border: none;
      border-radius: 50%;
      width: 42px;
      height: 42px;
      cursor: pointer;
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      align-self: flex-end;
      transition: background 0.15s;
    }
    #send-btn:hover { background: #1557b0; }
    #send-btn:disabled { background: #ccc; cursor: default; }
  </style>
</head>
<body>

<header>
  <h1>🤖 EasyLego Python Tutor</h1>
  <div style="display:flex;align-items:center;gap:16px;">
    <span>Powered by Claude</span>
    <button id="clear-btn" onclick="clearChat()">New Chat</button>
  </div>
</header>

<div id="chat-container">
  <div id="welcome">
    <h2>Hi! I'm your Python tutor 👋</h2>
    <p>Ask me anything about your LEGO robot or Python.<br>I'm here to help you learn!</p>
    <div class="chips">
      <div class="chip" onclick="sendChip(this)">How do I make a car move forward?</div>
      <div class="chip" onclick="sendChip(this)">What's a for loop?</div>
      <div class="chip" onclick="sendChip(this)">How do I detect colors?</div>
      <div class="chip" onclick="sendChip(this)">How do I use the controller?</div>
    </div>
  </div>
</div>

<div id="input-bar">
  <textarea id="user-input" placeholder="Ask a question..." rows="1"></textarea>
  <button id="send-btn" onclick="sendMessage()">&#9658;</button>
</div>

<script>
  let messages = [];

  const chatContainer = document.getElementById("chat-container");
  const input = document.getElementById("user-input");
  const sendBtn = document.getElementById("send-btn");

  // Auto-resize textarea
  input.addEventListener("input", () => {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 120) + "px";
  });

  // Send on Enter (Shift+Enter for newline)
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  function removeWelcome() {
    const welcome = document.getElementById("welcome");
    if (welcome) welcome.remove();
  }

  function appendMessage(role, content) {
    const wrapper = document.createElement("div");
    wrapper.className = `message ${role}`;

    const label = document.createElement("div");
    label.className = "label";
    label.textContent = role === "user" ? "You" : "Tutor";

    const bubble = document.createElement("div");
    bubble.className = "bubble";

    if (role === "assistant") {
      bubble.innerHTML = marked.parse(content);
    } else {
      bubble.textContent = content;
      bubble.style.whiteSpace = "pre-wrap";
    }

    wrapper.appendChild(label);
    wrapper.appendChild(bubble);
    chatContainer.appendChild(wrapper);
    chatContainer.scrollTop = chatContainer.scrollHeight;
    return wrapper;
  }

  function showTyping() {
    const wrapper = document.createElement("div");
    wrapper.className = "message assistant typing";
    wrapper.id = "typing-indicator";

    const label = document.createElement("div");
    label.className = "label";
    label.textContent = "Tutor";

    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.innerHTML = '<div class="dot"></div><div class="dot"></div><div class="dot"></div>';

    wrapper.appendChild(label);
    wrapper.appendChild(bubble);
    chatContainer.appendChild(wrapper);
    chatContainer.scrollTop = chatContainer.scrollHeight;
  }

  function removeTyping() {
    const indicator = document.getElementById("typing-indicator");
    if (indicator) indicator.remove();
  }

  function sendChip(el) {
    input.value = el.textContent;
    sendMessage();
  }

  async function sendMessage() {
    const text = input.value.trim();
    if (!text || sendBtn.disabled) return;

    removeWelcome();
    input.value = "";
    input.style.height = "auto";
    sendBtn.disabled = true;

    messages.push({ role: "user", content: text });
    appendMessage("user", text);
    showTyping();

    try {
      const res = await fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ messages }),
      });

      const data = await res.json();
      removeTyping();

      if (data.error) {
        appendMessage("assistant", "Sorry, something went wrong. Please try again.");
        messages.pop();
      } else {
        messages.push({ role: "assistant", content: data.response });
        appendMessage("assistant", data.response);
      }
    } catch (err) {
      removeTyping();
      appendMessage("assistant", "Could not reach the server. Make sure `chat_server.py` is running.");
      messages.pop();
    }

    sendBtn.disabled = false;
    input.focus();
  }

  function clearChat() {
    messages = [];
    chatContainer.innerHTML = `
      <div id="welcome">
        <h2>Hi! I'm your Python tutor 👋</h2>
        <p>Ask me anything about your LEGO robot or Python.<br>I'm here to help you learn!</p>
        <div class="chips">
          <div class="chip" onclick="sendChip(this)">How do I make the robot move forward?</div>
          <div class="chip" onclick="sendChip(this)">What's a for loop?</div>
          <div class="chip" onclick="sendChip(this)">How do I detect colors?</div>
          <div class="chip" onclick="sendChip(this)">How do I use the controller?</div>
        </div>
      </div>`;
    input.focus();
  }
</script>
</body>
</html>
